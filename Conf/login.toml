# VibraVid - logins (login.toml)
# Fill in only the services you use and leave the others empty.
# This file contains credentials: do not share it.
#
# email / password: just fill in the fields.
# cookies: export them with CookieInspector (https://github.com/AstraeLabs/Extension/)
#   and replace [paste here] with the export, keeping the three single quotes:
#   cookies = '''{"cookie_name":"cookie_value"}'''
# args: default options for every download of the service, written like on the command line, e.g. args = "--quality 1080" (see the docs).
# cdm: name of your WVD/PRD file, "search" or an id from [DRM.remote_cdm]. Empty = default (see the docs).
# profile: account profile to use, only for the services that have it (netflix): its number in the profile list (profile = "2") or its name (profile = "Kids"). Empty = the profile of your cookies. The run prints the numbered list.
# process: per-service pipeline switches, both off when the line is missing. live_mux = true: write the .mkv while downloading (streaming mux); live_decrypt = true: decrypt each segment as it arrives instead of after the download.

[aurora]
process = { live_mux = true, live_decrypt = true }
[raiplay]
process = { live_mux = true, live_decrypt = true }

