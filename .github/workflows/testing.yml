name: Run Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:
jobs:
  ruff-lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check ."
