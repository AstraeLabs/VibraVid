[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "VibraVid"
version = "1.4.9"
description = "Media downloader and streaming utility with ARR integration, GUI support, and DRM handling"
authors = [{ name = "AstraeLabs" }]
requires-python = ">=3.10,<3.15"
dynamic = ["dependencies", "optional-dependencies"]
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
keywords = [
    "downloader",
    "streaming",
    "drm",
    "arr",
    "gui",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/AstraeLabs/VibraVid"
Repository = "https://github.com/AstraeLabs/VibraVid"
Issues = "https://github.com/AstraeLabs/VibraVid/issues"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
gui = ["GUI/requirements.txt"]

[project.scripts]
vibravid = "VibraVid.cli.bootstrap:main"

[tool.hatch.build.targets.wheel.force-include]
"Conf/config.toml" = "VibraVid/config_defaults/config.toml"
"Conf/login.toml" = "VibraVid/config_defaults/login.toml"

[tool.hatch.build.targets.sdist.force-include]
"Conf/config.toml" = "Conf/config.toml"
"Conf/login.toml" = "Conf/login.toml"

[tool.ruff]
force-exclude = true
line-length = 120
extend-exclude = ["Test"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"VibraVid/utils/console/message.py" = ["W291"]
"GUI/searchapp/migrations/*.py" = ["E501", "F401"]
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["Test"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-ra --strict-markers"
