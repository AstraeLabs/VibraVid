<div class="cn-quality-picker">
    <label>Quality <select class="cn-quality-select" aria-label="Video quality"><option value="">Use config</option></select></label>
    <button type="button" class="cn-opt cn-quality-check">Check qualities</button>
    <span class="cn-quality-result" role="status">Up to 1080p. Unavailable qualities can be monitored in Watchlist.</span>
    <label class="cn-manual-choice"><input type="checkbox" class="cn-manual-tracks">
        Choose video, audio and subtitle tracks manually on the Downloads page
    </label>
</div>
