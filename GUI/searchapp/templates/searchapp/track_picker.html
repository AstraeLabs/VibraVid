<details class="cn-track-picker">
    <summary>Advanced tracks (CLI filters)</summary>
    <div class="cn-track-grid">
        <label>
            Video
            <input class="cn-track-video" type="text" list="cn-video-filters-{{ picker_id }}"
                   maxlength="160" placeholder="Use config (e.g. r=2160:c=hvc1:f=best)"
                   aria-label="Video track filter">
            <datalist id="cn-video-filters-{{ picker_id }}">
                <option value="best"></option>
                <option value="2160"></option>
                <option value="1080"></option>
                <option value="720"></option>
                <option value="480"></option>
                <option value="r=2160:c=hvc1:f=best"></option>
            </datalist>
        </label>
        <label>
            Audio
            <input class="cn-track-audio" type="text" list="cn-audio-filters-{{ picker_id }}"
                   maxlength="160" placeholder="Use config (e.g. ita|eng)"
                   aria-label="Audio track filter">
            <datalist id="cn-audio-filters-{{ picker_id }}">
                <option value="ita|eng"></option>
                <option value="ita"></option>
                <option value="eng"></option>
                <option value="all"></option>
                <option value="false"></option>
                <option value="l=ita:c=aac:f=best"></option>
            </datalist>
        </label>
        <label>
            Subtitles
            <input class="cn-track-subtitle" type="text" list="cn-subtitle-filters-{{ picker_id }}"
                   maxlength="160" placeholder="Use config (e.g. ita|eng)"
                   aria-label="Subtitle track filter">
            <datalist id="cn-subtitle-filters-{{ picker_id }}">
                <option value="ita|eng"></option>
                <option value="ita"></option>
                <option value="eng"></option>
                <option value="all"></option>
                <option value="false"></option>
                <option value="1ita|2eng"></option>
            </datalist>
        </label>
        <label class="cn-track-strict">
            <input class="cn-track-skip" type="checkbox">
            Skip if no track matches
        </label>
        <small>Blank uses config.json. CLI filter syntax is supported. Advanced video overrides the simple Quality field.</small>
    </div>
</details>
